name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: |
          # Each test process gets a private TMPDIR (scripts/test-tmpdir.sh):
          # test temp names restart their counter in every nextest process.
          export "CARGO_TARGET_$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')_RUNNER=$PWD/scripts/test-tmpdir.sh"
          cargo nextest run --workspace --locked --no-fail-fast
      # nextest does not run doctests.
      - name: doctests
        run: cargo test --doc --workspace --locked

  # ⚠️ Phase B5 — a SEPARATE AXIS, not an extra step on the jobs above, and that
  # is feature unification rather than tidiness: if any crate in a workspace
  # build enables `oracle`, every crate gets it. The product shape (one executor,
  # a gate refusal that is loud because it has nowhere to fall back to) therefore
  # only exists in a build that never enables it anywhere.
  #
  # ⚠️ `-p cli` rather than `--workspace`: the workspace's dev-dependencies pull
  # `sim-engine` with default features for the test targets, which re-enables
  # `oracle` and would make this axis test nothing. Measured — the first version
  # of this feature went green while doing exactly that, because `cli`'s plain
  # `sim-engine` dependency was missing `default-features = false`.
  build-no-oracle:
    name: build (product shape — no oracle backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-oracle
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: build
        run: cargo build -p cli -p sim-engine --locked --no-default-features
      - name: clippy
        run: cargo clippy -p cli -p sim-engine --locked --no-default-features -- -D warnings
      # B4b: the product shape has its OWN tests, and one of them only exists
      # here — a gate refusal must be FATAL when there is no executor to fall
      # back to. `--lib` because the integration targets pull dev-dependencies
      # that re-enable `oracle`.
      - name: test (lib)
        run: |
          # Each test process gets a private TMPDIR (scripts/test-tmpdir.sh):
          # test temp names restart their counter in every nextest process.
          export "CARGO_TARGET_$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')_RUNNER=$PWD/scripts/test-tmpdir.sh"
          cargo nextest run -p sim-engine --locked --no-default-features --lib
      - name: smoke — a design runs, and the absent executors are LOUD
        run: |
          set -euo pipefail
          printf 'module t;\n  reg [7:0] q = 0;\n  initial begin #1 q = 8'"'"'d7; $display("q=%%0d", q); $finish; end\nendmodule\n' > smoke.sv
          ./target/debug/vita smoke.sv | tee out.txt
          grep -q 'q=7' out.txt
          # the oracle spellings must be REJECTED, not silently ignored
          if ./target/debug/vita --backend vm smoke.sv; then
            echo "FAIL: --backend vm was accepted in a build without the VM"; exit 1
          fi

  build-rhel:
    name: build & test (RHEL9/UBI)
    runs-on: ubuntu-latest
    container: redhat/ubi9
    steps:
      - uses: actions/checkout@v6
      - name: install C linker
        run: dnf install -y gcc tar gzip
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: rhel9
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - run: cargo build --workspace --locked
      - name: test
        run: |
          # Each test process gets a private TMPDIR (scripts/test-tmpdir.sh):
          # test temp names restart their counter in every nextest process.
          export "CARGO_TARGET_$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')_RUNNER=$PWD/scripts/test-tmpdir.sh"
          cargo nextest run --workspace --locked --no-fail-fast
      - name: doctests
        run: cargo test --doc --workspace --locked

  # The workload corpus (docs/study/03-workload-corpus.md §8): clone the pinned
  # upstream RTL and grade every row against its pinned oracle digest, on all
  # three platforms, so the byte-identity claim is held on real designs. Blocking.
  # No `--compare`: CI has no iverilog, and the pinned digest is the oracle's.
  corpus:
    name: corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus-${{ matrix.os }}
      # The clones only, keyed on what pins them: a moved SHA misses the cache.
      # prepare.sh output lives outside src/ and is regenerated on every fetch.
      - uses: actions/cache@v6
        with:
          path: bench/*/src
          key: corpus-src-${{ runner.os }}-${{ hashFiles('crates/corpus-runner/src/corpus.rs', 'crates/corpus-runner/src/fetch.rs', 'bench/*/prepare.sh') }}
      # `run` requires target/release/vita.
      - name: build (release)
        run: cargo build --release -p cli --locked
      - name: fetch
        run: cargo run -p corpus-runner --locked -- fetch --run
      # Third-party RTL is never redistributed: every path the clones and the
      # prepare scripts write must be gitignored, so the tree is the checkout.
      - name: nothing fetched is committable
        run: |
          set -eu
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "FAIL: fetch left paths git would commit:"
            echo "$dirty"
            exit 1
          fi
      # `--reps 1` runs two rounds and compares both digests, so a non-deterministic
      # row still fails; the timed samples it drops are not gated in CI.
      - name: run
        run: cargo run -p corpus-runner --locked -- run --reps 1

  corpus-rhel:
    name: corpus (RHEL9/UBI)
    runs-on: ubuntu-latest
    container: redhat/ubi9
    steps:
      # git before checkout: without it actions/checkout downloads a tarball with
      # no .git, and the clean-tree step has no repository to ask. python3 runs
      # bench/biriscv/prepare.sh. safe.directory: the workspace belongs to the
      # runner user, not to the container's root.
      - name: install C linker, git, python3
        run: |
          dnf install -y gcc tar gzip git python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus-rhel9
      - uses: actions/cache@v6
        with:
          path: bench/*/src
          key: corpus-src-${{ runner.os }}-ubi9-${{ hashFiles('crates/corpus-runner/src/corpus.rs', 'crates/corpus-runner/src/fetch.rs', 'bench/*/prepare.sh') }}
      - name: build (release)
        run: cargo build --release -p cli --locked
      - name: fetch
        run: cargo run -p corpus-runner --locked -- fetch --run
      - name: nothing fetched is committable
        run: |
          set -eu
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "FAIL: fetch left paths git would commit:"
            echo "$dirty"
            exit 1
          fi
      # `--reps 1` runs two rounds and compares both digests, so a non-deterministic
      # row still fails; the timed samples it drops are not gated in CI.
      - name: run
        run: cargo run -p corpus-runner --locked -- run --reps 1

  # MSRV-CEIL — 1.85 is a floor, not a ceiling (CONTRIBUTING.md, preview/03 §4),
  # so one job stands on the ceiling: the latest stable. It is NON-BLOCKING: a red
  # here means a new Rust release breaks or newly lints the workspace — a signal
  # to follow, not a merge gate. `RUSTUP_TOOLCHAIN` is required: it is the only
  # thing that outranks `rust-toolchain.toml`, which would otherwise pin 1.85.0.
  build-stable:
    name: build & test (latest stable, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: toolchain
        run: rustc -V
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: |
          # Each test process gets a private TMPDIR (scripts/test-tmpdir.sh):
          # test temp names restart their counter in every nextest process.
          export "CARGO_TARGET_$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')_RUNNER=$PWD/scripts/test-tmpdir.sh"
          cargo nextest run --workspace --locked --no-fail-fast
      - name: doctests
        run: cargo test --doc --workspace --locked
