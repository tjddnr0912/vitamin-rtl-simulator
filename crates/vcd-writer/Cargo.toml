[package]
name = "vcd-writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sim-ir = { path = "../sim-ir" }
# FST waveform emission (VCD→FST transcode). BSD-3-Clause (Cornell / Kevin
# Laeufer), pure-Rust (lz4_flex + miniz_oxide). Pinned to =0.3.1: the 0.2.x line
# writes a malformed FST time-table that GTKWave/fst-reader tolerate but wellen
# (Surfer) rejects with "I/O operation failed" — 0.3.x fixes it (and adds a
# wellen end-to-end test). 0.3.x requires Rust 1.85 (edition 2024), which is why
# the workspace MSRV is 1.85. Verified to load in Surfer 0.7.0.
fst-writer = "=0.3.1"

[dev-dependencies]
# Independent FST reader (same author as fst-writer) — the transcode's
# correct-or-loud oracle: read the emitted FST back and assert it round-trips.
fst-reader = "=0.10.2"
