[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "vita"
path = "src/main.rs"

[features]
separate-bins = [] # dev 전용 — 기본 빌드는 vita 단일 multicall 바이너리만 산출 (doc-03)
# Forward the sim-engine native-codegen experiment (option A). OFF by default.
jit = ["sim-engine/jit"]

[[bin]]
name = "vcmp"
path = "src/bin/vcmp.rs"
required-features = ["separate-bins"]

[[bin]]
name = "velab"
path = "src/bin/velab.rs"
required-features = ["separate-bins"]

[[bin]]
name = "vrun"
path = "src/bin/vrun.rs"
required-features = ["separate-bins"]

[dependencies]
hdl-preprocess = { path = "../hdl-preprocess" }
hdl-lexer = { path = "../hdl-lexer" }
hdl-parser = { path = "../hdl-parser" }
hdl-ast = { path = "../hdl-ast" }
elaborate = { path = "../elaborate" }
sim-ir = { path = "../sim-ir" }
sim-engine = { path = "../sim-engine" }
diag = { path = "../diag" }
vita-log = { path = "../vita-log" }
vita-artifact = { path = "../vita-artifact" }
vita-schema = { path = "../vita-schema" }
postcard = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
vita-artifact = { path = "../vita-artifact" }
vita-schema = { path = "../vita-schema" }
# End-to-end FST verification: read back what `vita design.sv` (with a `.fst`
# $dumpfile) actually wrote and assert the waveform (independent reader oracle).
fst-reader = "=0.10.2"
postcard = { workspace = true }
blake3 = { workspace = true }
hdl-ast = { path = "../hdl-ast" }
hdl-lexer = { path = "../hdl-lexer" }
hdl-parser = { path = "../hdl-parser" }
elaborate = { path = "../elaborate" }
sim-ir = { path = "../sim-ir" }
sim-engine = { path = "../sim-engine" }
diag = { path = "../diag" }
